<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Hub — Навигация</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
    background: #0a0e17;
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Анимированный градиентный фон */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.08), transparent 60%);
    animation: bgPulse 12s ease-in-out infinite alternate;
    z-index: -2;
  }

  /* Сетка на фоне */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    z-index: -1;
  }

  @keyframes bgPulse {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(4deg); }
  }

  /* Заголовок */
  header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeDown 0.8s ease-out;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.08);
    margin-bottom: 20px;
    backdrop-filter: blur(6px);
  }

  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(120deg, #38bdf8, #a855f7 50%, #22c55e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 200% auto;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  header p {
    margin-top: 14px;
    color: #8b98a9;
    font-size: 1rem;
    max-width: 520px;
  }

  /* Сетка карточек */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
    animation: fadeUp 0.9s ease-out;
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* Карточка-ссылка */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 18px;
    border-radius: 18px;
    text-decoration: none;
    color: #e6edf3;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                border-color 0.35s,
                box-shadow 0.35s,
                background 0.35s;
  }

  /* Светящийся блик при наведении */
  .card::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(135deg, #38bdf8, #a855f7, #22c55e);
    opacity: 0;
    transition: opacity 0.35s;
    z-index: -1;
    filter: blur(14px);
  }

  .card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(56, 189, 248, 0.6);
    background: rgba(56, 189, 248, 0.06);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  }

  .card:hover::before {
    opacity: 0.55;
  }

  .card .num {
    font-size: 1.9rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    background: linear-gradient(120deg, #38bdf8, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 0.35s;
  }

  .card:hover .num {
    transform: scale(1.15);
  }

  .card .file {
    font-size: 0.78rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8b98a9;
    transition: color 0.35s;
  }

  .card:hover .file {
    color: #38bdf8;
  }

  .card .arrow {
    font-size: 1rem;
    color: #38bdf8;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s, transform 0.35s;
  }

  .card:hover .arrow {
    opacity: 1;
    transform: translateY(0);
  }

  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    color: #55606f;
    letter-spacing: 1px;
    animation: fadeUp 1.1s ease-out;
  }

  footer span {
    color: #38bdf8;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <header>
    <div class="badge"><span class="dot"></span> System Online</div>
    <h1>IT Navigation Hub</h1>
    <p>Быстрый доступ к разделам системы. Выберите нужный модуль для перехода.</p>
  </header>

  <main class="grid">
    <a class="card" href="0.html">
      <span class="num">00</span>
      <span class="file">Применение</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="1.html">
      <span class="num">01</span>
      <span class="file">Проектирование</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="2.html">
      <span class="num">02</span>
      <span class="file">Методология</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="3.html">
      <span class="num">03</span>
      <span class="file">Модель</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="4.html">
      <span class="num">04</span>
      <span class="file">GIT</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="5.html">
      <span class="num">05</span>
      <span class="file">Архитектура</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="6.html">
      <span class="num">06</span>
      <span class="file">HTTP</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="7.html">
      <span class="num">07</span>
      <span class="file">БД</span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="8.html">
      <span class="num">08</span>
      <span class="file">Тестирование</span>
      <span class="arrow">→</span>
    </a>
  </main>

  <footer>
    &copy; 2026 <span>IT Hub</span> — All systems operational
  </footer>

</body>
</html>
