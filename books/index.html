<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Книжная полка</title>
	<!-- Шрифт для эстетики -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			background: #2b1e16;
			/* тёмное дерево */
			background-image: radial-gradient(circle at 20% 30%, #4d3425 0%, #1f150e 100%);
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: 'Playfair Display', serif;
			padding: 2rem;
		}

		/* основная полка — деревянная текстура */
		.shelf-wrapper {
			background: #3d2c1e;
			background-image: repeating-linear-gradient(45deg,
					#4f3826 0px,
					#4f3826 2px,
					#5f4530 2px,
					#5f4530 6px);
			padding: 2rem 2rem 0.8rem 2rem;
			border-radius: 2rem 2rem 1rem 1rem;
			box-shadow:
				0 20px 30px rgba(0, 0, 0, 0.7),
				inset 0 -6px 0 #1f140e,
				inset 0 6px 10px rgba(255, 215, 150, 0.3);
			position: relative;
			transition: all 0.2s;
		}

		/* имитация торцов доски */
		.shelf-wrapper::before {
			content: '';
			position: absolute;
			bottom: -8px;
			left: 10%;
			width: 80%;
			height: 12px;
			background: #2a1d14;
			border-radius: 50%;
			filter: blur(6px);
			opacity: 0.6;
			z-index: 0;
		}

		.shelf {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: flex-end;
			gap: 2rem 2.5rem;
			max-width: 1100px;
			margin: 0 auto;
			padding-bottom: 0.5rem;
			position: relative;
			z-index: 2;
		}

		/* каждая книга — карточка с обложкой */
		.book {
			display: flex;
			flex-direction: column;
			align-items: center;
			filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
			transition: transform 0.25s ease, filter 0.3s;
			cursor: default;
			position: relative;
		}

		.book:hover {
			transform: translateY(-12px) scale(1.02);
			filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.7));
		}

		/* обложка книги */
		.cover {
			width: 150px;
			height: 220px;
			background: #8b6b4b;
			/* запасной цвет */
			border-radius: 6px 12px 12px 6px;
			box-shadow:
				inset 0 0 0 1px rgba(255, 215, 170, 0.3),
				4px 6px 12px rgba(0, 0, 0, 0.5);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			transition: all 0.2s;
			position: relative;
		}

		/* декоративный корешок (имитация) */
		.cover::after {
			content: '';
			position: absolute;
			top: 8px;
			left: 4px;
			width: 8px;
			height: 80%;
			background: rgba(0, 0, 0, 0.2);
			border-radius: 4px;
			box-shadow: inset 0 0 4px rgba(255, 215, 150, 0.3);
		}

		/* первая книга — используем 1.jpg */
		.book:first-child .cover {
			background-image: url('1.jpg');
			background-size: cover;
			background-position: center;
		}

		/* остальные книги — стилизованные заглушки с узорами */
		.book:nth-child(2) .cover {
			background: linear-gradient(145deg, #7a4a3a, #4d2e20);
			background-image: repeating-linear-gradient(45deg, #aa7a5a 0px, #aa7a5a 2px, #8b5f45 2px, #8b5f45 8px);
		}

		.book:nth-child(3) .cover {
			background: linear-gradient(135deg, #2a4b5c, #1d3340);
			background-image: radial-gradient(circle at 20% 30%, #4c7a8f 1px, transparent 1px),
				radial-gradient(circle at 70% 60%, #4c7a8f 1px, transparent 1px);
			background-size: 30px 30px, 40px 40px;
		}

		.book:nth-child(4) .cover {
			background: linear-gradient(45deg, #5e3c2b, #8b5a3a);
			background-image: repeating-linear-gradient(0deg, #c99f7a 0px, #c99f7a 1px, #8b5f45 1px, #8b5f45 6px);
		}

		.book:nth-child(5) .cover {
			background: linear-gradient(145deg, #4d3a2b, #281f16);
			background-image: radial-gradient(circle at 30% 40%, #a77b5a 3px, transparent 3px),
				radial-gradient(circle at 70% 70%, #a77b5a 3px, transparent 3px);
			background-size: 50px 50px, 60px 60px;
		}

		.book:nth-child(6) .cover {
			background: linear-gradient(45deg, #1f3d3d, #2f5a5a);
			background-image: linear-gradient(45deg, #488a8a 1px, transparent 1px),
				linear-gradient(-45deg, #488a8a 1px, transparent 1px);
			background-size: 12px 12px;
		}

		/* подпись под книгой (автор/название) — для атмосферы */
		.book-label {
			margin-top: 0.8rem;
			font-size: 0.8rem;
			letter-spacing: 0.06em;
			color: #e8dccc;
			text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
			background: rgba(30, 20, 12, 0.5);
			backdrop-filter: blur(2px);
			padding: 0.2rem 0.8rem;
			border-radius: 20px;
			border: 1px solid rgba(200, 170, 130, 0.2);
			font-weight: 400;
			white-space: nowrap;
			transition: 0.2s;
		}

		.book:hover .book-label {
			background: rgba(50, 35, 22, 0.8);
			color: #f5efe0;
			border-color: #c9a77b;
		}

		/* небольшая декоративная доска снизу */
		.shelf-footer {
			margin-top: 1.2rem;
			width: 100%;
			height: 8px;
			background: #2b1d12;
			border-radius: 20px;
			box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6), 0 -2px 4px rgba(200, 150, 100, 0.2);
			position: relative;
			z-index: 1;
		}

		/* адаптив */
		@media (max-width: 700px) {
			.shelf-wrapper {
				padding: 1.5rem 0.8rem 0.5rem 0.8rem;
			}

			.shelf {
				gap: 1.5rem 1.2rem;
			}

			.cover {
				width: 220px;
				height: 350px;
			}

			.book-label {
				font-size: 0.7rem;
				padding: 0.1rem 0.5rem;
			}
		}

		@media (max-width: 450px) {
			.cover {
				width: 200px;
				height: 250px;
			}

			.shelf {
				gap: 1rem 0.8rem;
			}

			.book-label {
				font-size: 0.6rem;
				white-space: normal;
			}
		}

		/* красивый текст-заголовок (необязательно) */
		.shelf-title {
			text-align: center;
			color: #eddccb;
			font-size: 1.1rem;
			letter-spacing: 6px;
			text-transform: uppercase;
			font-weight: 400;
			margin-bottom: 1.2rem;
			opacity: 0.7;
			text-shadow: 0 2px 3px #0f0a06;
			font-family: 'Playfair Display', serif;
			border-bottom: 1px solid rgba(200, 160, 120, 0.15);
			padding-bottom: 0.3rem;
		}
	</style>
</head>

<body>
	<div class="shelf-wrapper">
		<div class="shelf-title">📚 моя библиотека</div>
		<div class="shelf">

			<div class="book">
				<div class="cover"></div>
				<span class="book-label">О Чихоне и Нике</span> !Цитаты добавить из книги
			</div>

		</div>
		<div class="shelf-footer"></div>
	</div>
</body></html>
