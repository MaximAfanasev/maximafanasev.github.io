<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Bike</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<style>
		body {
			padding: 0;
			margin: 0 auto;
		}
		.wrapper {
			background-image: linear-gradient(to top, #16D0B1, #E16F4A);
			padding-top: 40px;
			padding-bottom: 40px;
		}
		.wrapper-r {
			background-image: linear-gradient(to top, #E16F4A, #16D0B1);
		}

		img {
			display: block;
			width: calc(100% - 40px);
			margin: 0 auto;
			max-width: 500px;
		}
	</style>
</head>

<body>

	<div class="wrapper">
		<img src="img/222.png" alt="">
	</div>

	<div class="wrapper wrapper-r">
		<img src="img/44.png" alt="">
	</div>

</body></html>
