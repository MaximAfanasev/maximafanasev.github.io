<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Bike</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		body {
			padding: 0;
			margin: 0 auto;
			background: #BCC5D1;
			padding-bottom: 50px;
		}

		.wrapper {
			background: #662EFF;
			padding-top: 40px;
		}

		.wrapper-t {
			position: relative;
			border-bottom-right-radius: 60px;
		}

		.wrapper-r {
			position: relative;
			background: #BCC5D1;
			border-top-left-radius: 60px;
		}

		.wrapper-t::before {
			position: absolute;
			content: "";
			width: 60px;
			height: 60px;
			left: 0;
			bottom: -60px;
			background: #662EFF;
		}

		img {
			display: block;
			width: calc(100% - 40px);
			margin: 0 auto;
		}


		@media screen and (min-width: 768px) {
			img {
				max-width: 800px;
			}
		}
		
		.radius {
			border-radius: 20px;
		}
	</style>
</head>

<body>

	<div class="wrapper wrapper-t">
		<img src="img/bike/0.png" alt="">
	</div>

	<div class="wrapper wrapper-r">
		<img src="img/bike/1.png" alt="">
	</div>

	<div class="wrapper wrapper-r">
		<img class="radius" src="img/bike/3.png" alt="">
	</div>
	
	

</body></html>
