<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Заголовок страницы</title>
	<!-- SEO -->
	<meta name="description" content="Подробное описание страницы">
	<meta name="keywords" content="ключевые, слова, пример">
	<meta name="author" content="Иван Иванов">
	<meta name="robots" content="index, follow">
	<!-- Open Graph -->
	<meta property="og:title" content="Заголовок для соцсетей">
	<meta property="og:description" content="Описание для соцсетей">
	<meta property="og:image" content="https://example.com/og-image.jpg">
	<meta property="og:url" content="https://example.com/page.html">
	<meta property="og:type" content="website">
	<!-- Twitter -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Заголовок для Twitter">
	<meta name="twitter:description" content="Описание для Twitter">
	<meta name="twitter:image" content="https://example.com/twitter-image.jpg">
	<!-- Дополнительно -->
	<meta name="copyright" content="Моя компания">
	<meta name="geo.region" content="RU">
	<meta name="robots" content="index, follow">
	<meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
	<meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
	<meta name="slurp" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
	<meta name="yandex" content="index, follow">
	<meta name="applebot" content="index, follow">
	<!-- Альтернативные инструкции -->
	<meta name="robots" content="noindex">
	<meta name="robots" content="nofollow">
	<meta name="robots" content="noarchive">
	<meta name="robots" content="nosnippet">
	<meta name="robots" content="noimageindex">
	<meta name="robots" content="noodp">
	<meta name="robots" content="notranslate">
	<!-- Для конкретных поисковых систем -->
	<meta name="googlebot-news" content="noindex">
	<meta name="googlebot" content="noimageindex">
	<meta name="yandex" content="none">
	<!-- Ограничение сканирования -->
	<meta name="robots" content="max-snippet:50">
	<meta name="robots" content="max-image-preview:standard">
	<meta name="robots" content="max-video-preview:60">
	<!-- Для определенных URL -->
	<meta name="robots" content="index, if allow: /private/">
	<meta name="robots" content="nofollow, if not allow: /public/">
	<style></style>
</head>
</html>
